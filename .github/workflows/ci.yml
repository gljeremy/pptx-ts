name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      # test fixtures are byte-sensitive; .gitattributes keeps them out of line-ending conversion
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # bundles for the browser (no Node-only imports), under the size budget, without the OLE icons
      - run: npm run check:bundle
      # npm pack -> install in a fresh Vite project -> vite build, and Node through both entries
      - run: npm run check:pack
