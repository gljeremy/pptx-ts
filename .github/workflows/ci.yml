name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      # test fixtures are byte-sensitive; .gitattributes keeps them out of line-ending conversion
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser bundle builds (no Node-only imports)
        run: npx esbuild dist/index.js --bundle --platform=browser --format=esm --minify --outfile=bundle.js
