<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pptx-ts demo</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  input, button { font: inherit; padding: 0.3rem 0.5rem; }
  pre { background: #f4f4f4; padding: 0.75rem; overflow-x: auto; }
</style>
<h1>pptx-ts in the browser</h1>
<p>Builds a deck entirely in this page (no server), then lets you download it. Build the bundle first:
<code>npm run build &amp;&amp; npm run demo:build</code>, then serve this folder, e.g. <code>npx http-server demo</code>.</p>
<p><label>Title <input id="title" value="Hello from pptx-ts"></label></p>
<p><label>Subtitle <input id="subtitle" value="Built in the browser"></label></p>
<p><button id="make">Build and download</button></p>
<pre id="log"></pre>
<script src="pptx.js"></script>
<script>
  document.getElementById("make").addEventListener("click", () => {
    const { Presentation, BytesIO, Inches, MSO_SHAPE } = pptx;
    const prs = Presentation();
    const slide = prs.slides.addSlide(prs.slideLayouts.at(0));
    slide.shapes.title.textFrame.text = document.getElementById("title").value;
    slide.placeholders.get(1).textFrame.text = document.getElementById("subtitle").value;
    const s2 = prs.slides.addSlide(prs.slideLayouts.at(6));
    s2.shapes.addShape(MSO_SHAPE.ROUNDED_RECTANGLE, Inches(1), Inches(1), Inches(4), Inches(1)).textFrame.text = "A shape";
    const table = s2.shapes.addTable(3, 3, Inches(1), Inches(2.5), Inches(6), Inches(1.5)).table;
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) table.cell(r, c).text = `r${r} c${c}`;
    const out = new BytesIO();
    prs.save(out);
    const bytes = out.getvalue();
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.presentationml.presentation" }));
    const a = Object.assign(document.createElement("a"), { href: url, download: "pptx-ts-demo.pptx" });
    a.click();
    URL.revokeObjectURL(url);
    document.getElementById("log").textContent = `saved ${bytes.length} bytes, ${prs.slides.length} slides`;
  });
</script>
